    .node { width: 7px; height: 7px; flex: 0 0 7px; border: 1px solid #849085; border-radius: 50%; background: var(--sidebar); }

          &lt;span&gt;时间轴&lt;/span&gt;&lt;span class=&quot;view-count&quot; id=&quot;total-count&quot;&gt;6&lt;/span&gt;

      &lt;/div&gt;
      &lt;div class=&quot;sidebar-note&quot;&gt;点击年、月可展开或收起；点击日期查看任务。&lt;br&gt;示例数据 · 不会连接或更改真实任务&lt;/div&gt;
    &lt;/aside&gt;
    &lt;main class=&quot;main&quot;&gt;
      &lt;header class=&quot;topbar&quot;&gt;
        &lt;div class=&quot;breadcrumbs&quot;&gt;&lt;span&gt;我的视图&lt;/span&gt;&lt;span class=&quot;slash&quot;&gt;/&lt;/span&gt;&lt;span&gt;时间轴&lt;/span&gt;&lt;span class=&quot;slash&quot;&gt;/&lt;/span&gt;&lt;strong id=&quot;breadcrumb&quot;&gt;11 月 6 日&lt;/strong&gt;&lt;/div&gt;
        &lt;span class=&quot;demo-badge&quot;&gt;示例数据&lt;/span&gt;
      &lt;/header&gt;
      &lt;div class=&quot;content&quot; id=&quot;content&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;&lt;/div&gt;
    &lt;/main&gt;

  &lt;script&gt;
    (() =&gt; {
      &#x27;use strict&#x27;;
      // 唯一数据源：年份、月份与总数均由每日示例任务相加得出。
      const years = [
        { year: 2026, months: [
          { month: 11, days: [
            { day: 6, tasks: [&#x27;整理本周事项&#x27;, &#x27;准备下周计划&#x27;, &#x27;回复待处理消息&#x27;] },
            { day: 5, tasks: [] }
          ] },
          { month: 10, days: [
            { day: 15, tasks: [&#x27;整理会议记录&#x27;, &#x27;检查待办清单&#x27;] }
          ] }
        ] },
        { year: 2025, months: [
          { month: 12, days: [
            { day: 8, tasks: [&#x27;回顾年度计划&#x27;] }
          ] }
        ] }
      ];
      const weekdays = [&#x27;周日&#x27;, &#x27;周一&#x27;, &#x27;周二&#x27;, &#x27;周三&#x27;, &#x27;周四&#x27;, &#x27;周五&#x27;, &#x27;周六&#x27;];
      const expandedYears = new Set([2026]);
      const expandedMonths = new Set([&#x27;2026-11&#x27;]);
      let selected = { kind: &#x27;day&#x27;, year: 2026, month: 11, day: 6 };
      const tree = document.getElementById(&#x27;timeline&#x27;);
      const content = document.getElementById(&#x27;content&#x27;);
      const keyOf = (year, month, day) =&gt; [year, month, day].filter(value =&gt; value !== undefined).join(&#x27;-&#x27;);
      const countMonth = month =&gt; month.days.reduce((sum, day) =&gt; sum + day.tasks.length, 0);
      const countYear = year =&gt; year.months.reduce((sum, month) =&gt; sum + countMonth(month), 0);
      const weekdayOf = (year, month, day) =&gt; weekdays[new Date(year, month - 1, day).getDay()];
      const escapeHtml = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, ch =&gt; ({ &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; })[ch]);
      const isSelected = key =&gt; key === keyOf(selected.year, selected.month, selected.day);

      function row(kind, key, label, count, isOpen, weekday) {
        const active = isSelected(key);
        const expanded = kind === &#x27;day&#x27; ? &#x27;&#x27; : ` aria-expanded=&quot;${isOpen}&quot; aria-controls=&quot;children-${key}&quot;`;
        const marker = kind === &#x27;day&#x27; ? &#x27;&#x27; : &#x27;&lt;span class=&quot;disclosure&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&#x27;;
        const dayOfWeek = weekday ? `&lt;span class=&quot;weekday&quot;&gt;${weekday}&lt;/span&gt;` : &#x27;&#x27;;
        return `&lt;button type=&quot;button&quot; class=&quot;tree-row ${kind}${active ? &#x27; is-selected&#x27; : &#x27;&#x27;}&quot; data-kind=&quot;${kind}&quot; data-key=&quot;${key}&quot; aria-pressed=&quot;${active}&quot;${expanded} aria-label=&quot;${label}，${count} 项未完成${weekday ? &#x27;，&#x27; + weekday : &#x27;&#x27;}&quot;&gt;${marker}&lt;span class=&quot;node&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;tree-text&quot;&gt;${label}&lt;/span&gt;${dayOfWeek}&lt;span class=&quot;count${count === 0 ? &#x27; is-zero&#x27; : &#x27;&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;${count}&lt;/span&gt;&lt;/button&gt;`;
      }

      function renderTree() {
        tree.innerHTML = years.map(year =&gt; {
          const yearKey = keyOf(year.year);
          const yearOpen = expandedYears.has(year.year);
          const months = year.months.map(month =&gt; {
            const monthKey = keyOf(year.year, month.month);
            const monthOpen = expandedMonths.has(monthKey);
            const days = month.days.map(day =&gt; {
              const dayKey = keyOf(year.year, month.month, day.day);
              return `&lt;li&gt;${row(&#x27;day&#x27;, dayKey, `${day.day} 日`, day.tasks.length, false, weekdayOf(year.year, month.month, day.day))}&lt;/li&gt;`;
            }).join(&#x27;&#x27;);
            return `&lt;li&gt;${row(&#x27;month&#x27;, monthKey, `${month.month} 月`, countMonth(month), monthOpen)}&lt;ul class=&quot;tree-group&quot; id=&quot;children-${monthKey}&quot;${monthOpen ? &#x27;&#x27; : &#x27; hidden&#x27;}&gt;${days}&lt;/ul&gt;&lt;/li&gt;`;
          }).join(&#x27;&#x27;);
          return `&lt;li&gt;${row(&#x27;year&#x27;, yearKey, `${year.year} 年`, countYear(year), yearOpen)}&lt;ul class=&quot;tree-group&quot; id=&quot;children-${yearKey}&quot;${yearOpen ? &#x27;&#x27; : &#x27; hidden&#x27;}&gt;${months}&lt;/ul&gt;&lt;/li&gt;`;
        }).join(&#x27;&#x27;);
        document.getElementById(&#x27;total-count&#x27;).textContent = years.reduce((sum, year) =&gt; sum + countYear(year), 0);
      }

      function renderContent() {
        const year = years.find(item =&gt; item.year === selected.year);
        const month = selected.month === undefined ? null : year.months.find(item =&gt; item.month === selected.month);
        const day = selected.day === undefined ? null : month.days.find(item =&gt; item.day === selected.day);
        let title, detail, groups;
        if (selected.kind === &#x27;year&#x27;) {
          title = `${year.year} 年`;
          detail = &#x27;这一年的示例任务&#x27;;
          groups = year.months.flatMap(m =&gt; m.days.map(d =&gt; ({ year: year.year, month: m.month, ...d })));
        } else if (selected.kind === &#x27;month&#x27;) {
          title = `${month.month} 月`;
          detail = `${year.year} 年的示例任务`;
          groups = month.days.map(d =&gt; ({ year: year.year, month: month.month, ...d }));
        } else {
          title = `${month.month} 月 ${day.day} 日`;
          detail = `${year.year} 年 · ${weekdayOf(year.year, month.month, day.day)}`;
          groups = [{ year: year.year, month: month.month, ...day }];
        }
        const total = groups.reduce((sum, group) =&gt; sum + group.tasks.length, 0);
        const populatedGroups = groups.filter(group =&gt; group.tasks.length &gt; 0);
        const taskHtml = populatedGroups.map(group =&gt; {
          const groupTitle = selected.kind === &#x27;day&#x27; ? &#x27;&#x27; : `&lt;div class=&quot;group-head&quot;&gt;${group.month} 月 ${group.day} 日 &lt;span&gt;${weekdayOf(group.year, group.month, group.day)} · ${group.tasks.length} 项&lt;/span&gt;&lt;/div&gt;`;
          const rows = group.tasks.map(task =&gt; `&lt;li class=&quot;task-row&quot;&gt;&lt;span class=&quot;task-marker&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;task-name&quot;&gt;${escapeHtml(task)}&lt;/span&gt;&lt;span class=&quot;task-date&quot;&gt;${group.month} 月 ${group.day} 日&lt;/span&gt;&lt;/li&gt;`).join(&#x27;&#x27;);
          return `&lt;section class=&quot;task-group&quot;&gt;${groupTitle}&lt;ul class=&quot;task-list&quot;&gt;${rows}&lt;/ul&gt;&lt;/section&gt;`;
        }).join(&#x27;&#x27;);
        const emptyHtml = `&lt;div class=&quot;empty&quot;&gt;&lt;strong&gt;暂无未完成示例任务&lt;/strong&gt;&lt;p&gt;所选日期的未完成数量为 0。&lt;/p&gt;&lt;/div&gt;`;
        document.getElementById(&#x27;breadcrumb&#x27;).textContent = title;
        content.innerHTML = `&lt;p class=&quot;eyebrow&quot;&gt;时间轴&lt;/p&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;p class=&quot;summary&quot;&gt;&lt;span&gt;${detail}&lt;/span&gt;&lt;span class=&quot;summary-separator&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span&gt;${total} 项未完成&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;sample-notice&quot;&gt;以下为示例数据，仅用于展示时间轴的交互，不连接真实任务库。&lt;/p&gt;&lt;section class=&quot;task-section&quot; aria-label=&quot;未完成示例任务&quot;&gt;&lt;div class=&quot;list-head&quot;&gt;&lt;h2&gt;未完成&lt;/h2&gt;&lt;span class=&quot;list-count&quot;&gt;${total} 项&lt;/span&gt;&lt;/div&gt;${total ? taskHtml : emptyHtml}&lt;p class=&quot;footnote&quot;&gt;任务内容仅为示意；圆点不可勾选，不会写入任何数据。&lt;/p&gt;&lt;/section&gt;`;
      }

      tree.addEventListener(&#x27;click&#x27;, event =&gt; {
        const button = event.target.closest(&#x27;button[data-kind]&#x27;);
        if (!button || !tree.contains(button)) return;
        const parts = button.dataset.key.split(&#x27;-&#x27;).map(Number);
        const kind = button.dataset.kind;
        selected = { kind, year: parts[0] };
        if (parts.length &gt; 1) selected.month = parts[1];
        if (parts.length &gt; 2) selected.day = parts[2];
        if (kind === &#x27;year&#x27;) {
          expandedYears.has(parts[0]) ? expandedYears.delete(parts[0]) : expandedYears.add(parts[0]);
        } else if (kind === &#x27;month&#x27;) {
          expandedMonths.has(button.dataset.key) ? expandedMonths.delete(button.dataset.key) : expandedMonths.add(button.dataset.key);
        }
        const selectedKey = button.dataset.key;
        renderTree();
        renderContent();
        const nextButton = tree.querySelector(`button[data-key=&quot;${selectedKey}&quot;]`);
        if (nextButton) nextButton.focus({ preventScroll: true });
      });
      renderTree();
      renderContent();
    })();
  &lt;/script&gt;

      &lt;div class=&quot;sidebar-top&quot;&gt;
        &lt;span class=&quot;brand-mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;svg width=&quot;13&quot; height=&quot;13&quot; viewBox=&quot;0 0 13 13&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M2 3.25h9M2 6.5h6.5M2 9.75h9&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.3&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;
        &lt;span class=&quot;brand-title&quot;&gt;任务看板&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;sidebar-scroll&quot;&gt;
        &lt;div class=&quot;index-header&quot;&gt;
          &lt;div&gt;&lt;h2 class=&quot;index-title&quot;&gt;日期索引&lt;/h2&gt;&lt;p class=&quot;index-subtitle&quot;&gt;按时间浏览&lt;/p&gt;&lt;/div&gt;
          &lt;span class=&quot;count-heading&quot;&gt;未完成&lt;/span&gt;
        &lt;/div&gt;
        &lt;nav class=&quot;timeline&quot; id=&quot;timeline&quot; aria-label=&quot;年月日时间轴&quot;&gt;&lt;/nav&gt;
      &lt;/div&gt;
      &lt;div class=&quot;sidebar-foot&quot;&gt;&lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;示例数据 · 未连接真实任务库&lt;/div&gt;
    &lt;/aside&gt;
    &lt;main class=&quot;main&quot;&gt;
      &lt;div class=&quot;topbar&quot;&gt;&lt;div class=&quot;topbar-path&quot;&gt;任务看板 &lt;span&gt;/&lt;/span&gt; &lt;b&gt;日期&lt;/b&gt;&lt;/div&gt;&lt;span class=&quot;sample-pill&quot;&gt;示例数据&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;content&quot; id=&quot;content&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;&lt;/div&gt;
    &lt;/main&gt;
  &lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      &#x27;use strict&#x27;;
      // 每条记录仅用于演示。年、月计数均从所属日期任务计算，避免口径不一致。
      const exampleData = [
        { year: 2026, months: [
          { month: 11, short: &#x27;NOV&#x27;, days: [
            { day: 6, weekday: &#x27;周五&#x27;, tasks: [&#x27;整理本周事项&#x27;, &#x27;准备下周计划&#x27;, &#x27;回复待处理消息&#x27;] },
            { day: 5, weekday: &#x27;周四&#x27;, tasks: [] }
          ] },
          { month: 10, short: &#x27;OCT&#x27;, days: [
            { day: 15, weekday: &#x27;周四&#x27;, tasks: [&#x27;整理会议记录&#x27;, &#x27;检查待办清单&#x27;] }
          ] }
        ] },
        { year: 2025, months: [
          { month: 12, short: &#x27;DEC&#x27;, days: [
            { day: 8, weekday: &#x27;周一&#x27;, tasks: [&#x27;回顾年度计划&#x27;] }
          ] }
        ] }
      ];

      const expandedYears = new Set([2026]);
      const expandedMonths = new Set([&#x27;2026-11&#x27;]);
      let selected = { year: 2026, month: 11, day: 6 };
      const timeline = document.getElementById(&#x27;timeline&#x27;);
      const content = document.getElementById(&#x27;content&#x27;);
      const chevron = &#x27;&lt;svg class=&quot;chevron&quot; width=&quot;12&quot; height=&quot;12&quot; viewBox=&quot;0 0 12 12&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;m2.5 4.25 3.5 3.5 3.5-3.5&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;&#x27;;
      const pad = number =&gt; String(number).padStart(2, &#x27;0&#x27;);
      const monthKey = (year, month) =&gt; `${year}-${month}`;
      const countMonth = month =&gt; month.days.reduce((sum, day) =&gt; sum + day.tasks.length, 0);
      const countYear = year =&gt; year.months.reduce((sum, month) =&gt; sum + countMonth(month), 0);
      const isSelected = (year, month, day) =&gt; selected.year === year &amp;&amp; selected.month === month &amp;&amp; selected.day === day;
      const current = active =&gt; active ? &#x27; is-selected&#x27; : &#x27;&#x27;;
      const currentAttr = (active, kind) =&gt; active ? ` aria-current=&quot;${kind === &#x27;day&#x27; ? &#x27;date&#x27; : &#x27;true&#x27;}&quot;` : &#x27;&#x27;;
      const safe = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, char =&gt; ({ &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; })[char]);
      const count = n =&gt; `&lt;span class=&quot;node-count${n === 0 ? &#x27; zero&#x27; : &#x27;&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;${n}&lt;/span&gt;`;

      function renderTimeline() {
        timeline.innerHTML = exampleData.map(year =&gt; {
          const yearOpen = expandedYears.has(year.year);
          const yearActive = isSelected(year.year, undefined, undefined);
          const yearId = `year-${year.year}`;
          const months = year.months.map(month =&gt; {
            const key = monthKey(year.year, month.month);
            const monthOpen = expandedMonths.has(key);
            const monthActive = isSelected(year.year, month.month, undefined);
            const monthId = `month-${key}`;
            const days = month.days.map(day =&gt; {
              const active = isSelected(year.year, month.month, day.day);
              const label = `${year.year}年${month.month}月${day.day}日，${day.tasks.length}项未完成`;
              return `&lt;button type=&quot;button&quot; class=&quot;node day-node${current(active)}&quot; data-kind=&quot;day&quot; data-year=&quot;${year.year}&quot; data-month=&quot;${month.month}&quot; data-day=&quot;${day.day}&quot; data-key=&quot;${year.year}-${month.month}-${day.day}&quot; aria-label=&quot;${label}&quot;${currentAttr(active, &#x27;day&#x27;)}&gt;&lt;span class=&quot;marker day-marker&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;node-label&quot;&gt;&lt;span class=&quot;day-number&quot;&gt;${pad(day.day)}&lt;/span&gt;&lt;span class=&quot;day-unit&quot;&gt;日&lt;/span&gt;&lt;span class=&quot;weekday&quot;&gt;${day.weekday}&lt;/span&gt;&lt;/span&gt;${count(day.tasks.length)}${chevron}&lt;/button&gt;`;
            }).join(&#x27;&#x27;);
            return `&lt;div class=&quot;month-group&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;node month-node${current(monthActive)}&quot; data-kind=&quot;month&quot; data-year=&quot;${year.year}&quot; data-month=&quot;${month.month}&quot; data-key=&quot;${key}&quot; aria-label=&quot;${year.year}年${month.month}月，${countMonth(month)}项未完成&quot; aria-expanded=&quot;${monthOpen}&quot; aria-controls=&quot;${monthId}&quot;${currentAttr(monthActive, &#x27;month&#x27;)}&gt;&lt;span class=&quot;marker month-marker&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;node-label&quot;&gt;&lt;span class=&quot;month-name&quot;&gt;${month.month}月&lt;/span&gt;&lt;span class=&quot;month-en&quot;&gt;${month.short}&lt;/span&gt;&lt;/span&gt;${count(countMonth(month))}${chevron}&lt;/button&gt;&lt;div id=&quot;${monthId}&quot;${monthOpen ? &#x27;&#x27; : &#x27; hidden&#x27;}&gt;${days}&lt;/div&gt;&lt;/div&gt;`;
          }).join(&#x27;&#x27;);
          return `&lt;div class=&quot;year-group&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;node year-node${current(yearActive)}&quot; data-kind=&quot;year&quot; data-year=&quot;${year.year}&quot; data-key=&quot;${year.year}&quot; aria-label=&quot;${year.year}年，${countYear(year)}项未完成&quot; aria-expanded=&quot;${yearOpen}&quot; aria-controls=&quot;${yearId}&quot;${currentAttr(yearActive, &#x27;year&#x27;)}&gt;&lt;span class=&quot;marker year-marker&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;node-label&quot;&gt;&lt;span class=&quot;year-number&quot;&gt;${year.year}&lt;/span&gt;&lt;span class=&quot;year-unit&quot;&gt;年&lt;/span&gt;&lt;/span&gt;${count(countYear(year))}${chevron}&lt;/button&gt;&lt;div id=&quot;${yearId}&quot;${yearOpen ? &#x27;&#x27; : &#x27; hidden&#x27;}&gt;${months}&lt;/div&gt;&lt;/div&gt;`;
        }).join(&#x27;&#x27;);
      }

      function renderContent() {
        const year = exampleData.find(item =&gt; item.year === selected.year);
        const months = selected.month === undefined ? year.months : year.months.filter(item =&gt; item.month === selected.month);
        const selectedMonth = selected.month === undefined ? undefined : months[0];
        const selectedDay = selected.day === undefined ? undefined : selectedMonth.days.find(item =&gt; item.day === selected.day);
        const rows = months.flatMap(month =&gt; month.days
          .filter(day =&gt; selected.day === undefined || day.day === selected.day)
          .flatMap(day =&gt; day.tasks.map(task =&gt; ({ title: task, date: `${year.year}.${pad(month.month)}.${pad(day.day)}` }))));
        const title = selectedDay ? `${selected.month}月${selected.day}日` : selectedMonth ? `${year.year}年${selected.month}月` : `${year.year}年`;
        const eyebrow = selectedDay ? `${year.year}年 · ${selectedDay.weekday}` : selectedMonth ? &#x27;按月查看&#x27; : &#x27;按年查看&#x27;;
        const description = selectedDay ? &#x27;这一天的未完成任务&#x27; : selectedMonth ? &#x27;这个月的未完成任务&#x27; : &#x27;这一年的未完成任务&#x27;;
        const list = rows.length ? `&lt;div class=&quot;list-label&quot;&gt;&lt;span&gt;未完成&lt;/span&gt;&lt;span&gt;日期&lt;/span&gt;&lt;/div&gt;&lt;ul class=&quot;tasks&quot;&gt;${rows.map(row =&gt; `&lt;li class=&quot;task&quot;&gt;&lt;span class=&quot;task-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;task-title&quot;&gt;${safe(row.title)}&lt;/span&gt;&lt;time class=&quot;task-date&quot;&gt;${row.date}&lt;/time&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;` : `&lt;div class=&quot;empty&quot;&gt;&lt;span class=&quot;empty-mark&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/span&gt;&lt;strong&gt;暂无未完成任务&lt;/strong&gt;&lt;p&gt;这一天的示例列表是空的&lt;/p&gt;&lt;/div&gt;`;
        content.innerHTML = `&lt;p class=&quot;eyebrow&quot;&gt;${eyebrow}&lt;/p&gt;&lt;div class=&quot;heading-row&quot;&gt;&lt;div&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;p&gt;${description}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;heading-count&quot;&gt;&lt;strong&gt;${rows.length}&lt;/strong&gt;项未完成&lt;/div&gt;&lt;/div&gt;${list}&lt;p class=&quot;content-note&quot;&gt;示例内容，仅为示意；不读取或修改真实任务。&lt;/p&gt;`;
      }

      timeline.addEventListener(&#x27;click&#x27;, event =&gt; {
        const button = event.target.closest(&#x27;button[data-kind]&#x27;);
        if (!button || !timeline.contains(button)) return;
        const year = Number(button.dataset.year);
        const month = button.dataset.month === undefined ? undefined : Number(button.dataset.month);
        const day = button.dataset.day === undefined ? undefined : Number(button.dataset.day);
        const key = button.dataset.key;
        if (button.dataset.kind === &#x27;year&#x27;) {
          expandedYears.has(year) ? expandedYears.delete(year) : expandedYears.add(year);
        } else if (button.dataset.kind === &#x27;month&#x27;) {
          const keyForMonth = monthKey(year, month);
          expandedMonths.has(keyForMonth) ? expandedMonths.delete(keyForMonth) : expandedMonths.add(keyForMonth);
        }
        selected = { year, month, day };
        renderTimeline();
        renderContent();
        const restored = Array.from(timeline.querySelectorAll(&#x27;button[data-key]&#x27;)).find(item =&gt; item.dataset.key === key);
        if (restored) restored.focus({ preventScroll: true });
      });
      renderTimeline();
      renderContent();
    })();
  &lt;/script&gt;

&lt;!-- 独立视觉草稿；所有日期和任务均为示例，不连接真实库。 --&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;aside class=&quot;side&quot; aria-label=&quot;时间轴导航&quot;&gt;
    &lt;div class=&quot;side-head&quot;&gt;
      &lt;div class=&quot;brand&quot;&gt;&lt;span class=&quot;brand-mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;svg viewBox=&quot;0 0 16 16&quot; fill=&quot;none&quot;&gt;&lt;path d=&quot;M5 2.5v11m6-11v11M2.5 5h11M2.5 11h11&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;任务空间&lt;/div&gt;

  &lt;/aside&gt;

    &lt;div class=&quot;crumb&quot;&gt;&lt;span&gt;任务&lt;/span&gt;&lt;i&gt;/&lt;/i&gt;&lt;span&gt;时间轴&lt;/span&gt;&lt;i&gt;/&lt;/i&gt;&lt;span id=&quot;crumb&quot;&gt;2026年11月6日&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;overline&quot; id=&quot;eyebrow&quot;&gt;2026 年 · 11 月 · 星期五&lt;/div&gt;&lt;h1 id=&quot;title&quot;&gt;11月6日&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;count&quot;&gt;&lt;strong id=&quot;count&quot;&gt;3&lt;/strong&gt;项未完成&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;example&quot;&gt;&lt;b&gt;这是一个交互示例&lt;/b&gt;&lt;span id=&quot;description&quot;&gt;在左侧点击年、月、日可切换视图；箭头用于展开和收起。&lt;/span&gt;&lt;/div&gt;

&lt;script&gt;
const data=[{year:2026,months:[{month:11,days:[{day:6,count:3,tasks:[&#x27;整理本周事项&#x27;,&#x27;准备下周计划&#x27;,&#x27;回复待处理消息&#x27;]},{day:5,count:0,tasks:[]}]},{month:10,days:[{day:15,count:2,tasks:[&#x27;整理会议记录&#x27;,&#x27;检查待办清单&#x27;]}]}]},{year:2025,months:[{month:12,days:[{day:8,count:1,tasks:[&#x27;回顾年度计划&#x27;]}]}]}];
const state={selected:&#x27;2026-11-06&#x27;,expandedYears:new Set([2026]),expandedMonths:new Set([&#x27;2026-11&#x27;])};
const total=days=&gt;days.reduce((sum,day)=&gt;sum+day.count,0);
const pad=n=&gt;String(n).padStart(2,&#x27;0&#x27;);
function make(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function button(className,label,handler){const node=make(&#x27;button&#x27;,className);node.type=&#x27;button&#x27;;node.setAttribute(&#x27;aria-label&#x27;,label);node.addEventListener(&#x27;click&#x27;,handler);return node}
function disclosure(kind,opened,label,handler){const node=button(kind+&#x27;-toggle toggle&#x27;,label,handler);node.setAttribute(&#x27;aria-expanded&#x27;,String(opened));const c=make(&#x27;span&#x27;,&#x27;chev&#x27;);c.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);node.append(c);return node}
function select(value){const focusLabel=document.activeElement?.getAttribute(&#x27;aria-label&#x27;);state.selected=value;render();renderDetails();if(focusLabel)Array.from(document.querySelectorAll(&#x27;#timeline button&#x27;)).find(el=&gt;el.getAttribute(&#x27;aria-label&#x27;)===focusLabel)?.focus({preventScroll:true})}
function render(){const root=document.querySelector(&#x27;#timeline&#x27;);root.replaceChildren();for(const year of data){const yKey=String(year.year),yCount=year.months.reduce((sum,m)=&gt;sum+total(m.days),0),open=state.expandedYears.has(year.year),wrap=make(&#x27;section&#x27;,&#x27;year&#x27;),row=make(&#x27;div&#x27;,&#x27;year-row&#x27;);row.append(disclosure(&#x27;year&#x27;,open,`${open?&#x27;收起&#x27;:&#x27;展开&#x27;} ${year.year}年`,()=&gt;{open?state.expandedYears.delete(year.year):state.expandedYears.add(year.year);render()}));const label=button(&#x27;year-name&#x27;+(state.selected===yKey?&#x27; selected-period&#x27;:&#x27;&#x27;),`查看 ${year.year}年`,()=&gt;select(yKey));label.textContent=year.year;row.append(label,make(&#x27;span&#x27;,&#x27;year-count&#x27;,String(yCount)));wrap.append(row);if(open){const body=make(&#x27;div&#x27;,&#x27;year-body&#x27;);for(const month of year.months){const key=`${year.year}-${pad(month.month)}`,isOpen=state.expandedMonths.has(key),block=make(&#x27;div&#x27;,&#x27;month&#x27;),monthRow=make(&#x27;div&#x27;,&#x27;month-row&#x27;);monthRow.append(disclosure(&#x27;month&#x27;,isOpen,`${isOpen?&#x27;收起&#x27;:&#x27;展开&#x27;} ${year.year}年${month.month}月`,()=&gt;{isOpen?state.expandedMonths.delete(key):state.expandedMonths.add(key);render()}));const m=button(&#x27;month-name&#x27;+(state.selected===key?&#x27; selected-period&#x27;:&#x27;&#x27;),`查看 ${year.year}年${month.month}月`,()=&gt;select(key));m.textContent=`${month.month}月`;monthRow.append(m,make(&#x27;span&#x27;,&#x27;month-count&#x27;,String(total(month.days))));block.append(monthRow);if(isOpen){const days=make(&#x27;div&#x27;,&#x27;days&#x27;);for(const day of month.days){const iso=`${key}-${pad(day.day)}`,d=button(&#x27;day&#x27;,`查看 ${year.year}年${month.month}月${day.day}日，${day.count}项未完成`,()=&gt;select(iso));if(state.selected===iso)d.setAttribute(&#x27;aria-current&#x27;,&#x27;date&#x27;);const weekday=new Date(year.year,month.month-1,day.day).toLocaleDateString(&#x27;zh-CN&#x27;,{weekday:&#x27;short&#x27;});d.append(make(&#x27;span&#x27;,&#x27;day-number&#x27;,pad(day.day)),make(&#x27;span&#x27;,&#x27;day-week&#x27;,weekday));if(iso===&#x27;2026-11-06&#x27;){const dot=make(&#x27;span&#x27;,&#x27;today-dot&#x27;);dot.title=&#x27;示例中的今天&#x27;;d.append(dot)}d.append(make(&#x27;span&#x27;,&#x27;day-count&#x27;,`${day.count} 项`));days.append(d)}block.append(days)}body.append(block)}wrap.append(body)}root.append(wrap)}}
function renderDetails(){const parts=state.selected.split(&#x27;-&#x27;).map(Number),year=data.find(y=&gt;y.year===parts[0]),month=year?.months.find(m=&gt;m.month===parts[1]),day=month?.days.find(d=&gt;d.day===parts[2]);const count=day?day.count:month?total(month.days):year.months.reduce((sum,m)=&gt;sum+total(m.days),0);const full=parts.length===1?`${parts[0]}年`:parts.length===2?`${parts[0]}年${parts[1]}月`:`${parts[0]}年${parts[1]}月${parts[2]}日`;document.querySelector(&#x27;#crumb&#x27;).textContent=full;document.querySelector(&#x27;#title&#x27;).textContent=parts.length===1?`${parts[0]}年`:parts.length===2?`${parts[1]}月`:`${parts[1]}月${parts[2]}日`;document.querySelector(&#x27;#eyebrow&#x27;).textContent=parts.length===3?`${parts[0]} 年 · ${parts[1]} 月 · ${new Date(parts[0],parts[1]-1,parts[2]).toLocaleDateString(&#x27;zh-CN&#x27;,{weekday:&#x27;long&#x27;})}`:parts.length===2?`${parts[0]} 年 · 月视图`:&#x27;年视图&#x27;;document.querySelector(&#x27;#count&#x27;).textContent=count;document.querySelector(&#x27;#section-title&#x27;).textContent=day?&#x27;该日的示例任务&#x27;:&#x27;这个时段的示例任务&#x27;;const tasks=day?day.tasks:month?month.days.flatMap(d=&gt;d.tasks):year.months.flatMap(m=&gt;m.days.flatMap(d=&gt;d.tasks));const list=document.querySelector(&#x27;#task-list&#x27;);list.replaceChildren();if(!tasks.length)list.append(make(&#x27;div&#x27;,&#x27;empty&#x27;,&#x27;这一天没有未完成的示例任务。&#x27;));else tasks.forEach(text=&gt;list.append(make(&#x27;div&#x27;,&#x27;task&#x27;,text)))}
render();renderDetails();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
    </section></main>
<script>
(()=>{const buttons=[...document.querySelectorAll('[data-view]')],panels=[...document.querySelectorAll('[data-panel]')];function show(name){panels.forEach(panel=>{panel.hidden=panel.dataset.panel!==name});buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===name)));window.scrollTo({top:0,behavior:'instant'})}buttons.forEach(button=>button.addEventListener('click',()=>show(button.dataset.view)));document.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>show(button.dataset.open)))})();
</script>
